# ==========================================
# GitHub Pages 自动部署（原生 Pages artifact 方案）
# push 到 master 时自动构建 dist 并部署到 GitHub Pages
# 需要仓库 Settings → Pages → Source 选择 "GitHub Actions"
# ==========================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新的推送会取消进行中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 任务 1：构建 dist 并上传为 Pages artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 任务 2：把 artifact 部署到 GitHub Pages（依赖任务 1 完成）
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
